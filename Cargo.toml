[package]
name = "vision"
version = "0.1.1"
edition = "2021"
publish = false
description = "Vision: a fast native home launcher for rooted LG webOS TVs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crypto_secretbox = "0.1"
ed25519-compact = { version = "2", default-features = false }
fontdue = "0.9"
getrandom = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
libloading = "0.8"
png = "0.17"
qrcodegen = "1.8"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Font rasterisation and PNG decoding stay fast in debug desktop previews.
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
